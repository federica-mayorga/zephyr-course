board:
  name: our_board
  full_name: Our Board
  vendor: zephyr-course
  socs:
    - name: nrf54l05
    - name: nrf54l10
      variants:
        - name: ns
          cpucluster: cpuapp
    - name: nrf54l15
      variants:
        - name: xip
          cpucluster: cpuflpr
        - name: ns
          cpucluster: cpuapp
runners:
  run_once:
    '--recover':
      - runners:
          - nrfjprog
          - nrfutil
        run: first
        groups:
          - boards:
              - our_board/nrf54l15/cpuapp
              - our_board/nrf54l15/cpuapp/ns
              - our_board/nrf54l15/cpuflpr
              - our_board/nrf54l15/cpuflpr/xip
    '--erase':
      - runners:
          - nrfjprog
          - jlink
          - nrfutil
        run: first
        groups:
          - boards:
              - our_board/nrf54l15/cpuapp
              - our_board/nrf54l15/cpuapp/ns
              - our_board/nrf54l15/cpuflpr
              - our_board/nrf54l15/cpuflpr/xip
    '--reset':
      - runners:
          - nrfjprog
          - jlink
          - nrfutil
        run: last
        groups:
          - boards:
              - our_board/nrf54l15/cpuapp
              - our_board/nrf54l15/cpuapp/ns
              - our_board/nrf54l15/cpuflpr
              - our_board/nrf54l15/cpuflpr/xip
